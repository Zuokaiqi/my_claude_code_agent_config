<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img">
<title>内容线与编码线的现状</title>
<desc>两条线各自四段，共用同一套前端底线和语言规则。内容线全在skill里，编码线靠规则加agent。</desc>
<style>
.bg{fill:#FFFFFF}
.th{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:500}
.ts{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px}
.tm{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px}
.ln{stroke:#B4B2A9;stroke-width:1.5;fill:none}
.p rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.p .th{fill:#3C3489}
.p .ts,.p .tm{fill:#534AB7}
.t rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.t .th{fill:#085041}
.t .ts,.t .tm{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c .th{fill:#712B13}
.c .ts,.c .tm{fill:#993C1D}
.g rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.g .th{fill:#444441}
.g .ts,.g .tm{fill:#5F5E5A}
.lg{fill:#5F5E5A;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px}
@media (prefers-color-scheme:dark){
.bg{fill:#1B1B1A}
.ln{stroke:#888780}
.p rect{fill:#3C3489;stroke:#AFA9EC}
.p .th{fill:#CECBF6}
.p .ts,.p .tm{fill:#AFA9EC}
.t rect{fill:#085041;stroke:#5DCAA5}
.t .th{fill:#9FE1CB}
.t .ts,.t .tm{fill:#5DCAA5}
.c rect{fill:#712B13;stroke:#F0997B}
.c .th{fill:#F5C4B3}
.c .ts,.c .tm{fill:#F0997B}
.g rect{fill:#444441;stroke:#B4B2A9}
.g .th{fill:#D3D1C7}
.g .ts,.g .tm{fill:#B4B2A9}
.lg{fill:#B4B2A9}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="680"/>

<g class="p"><rect x="20" y="8" width="315" height="30" rx="6"/><text class="th" x="177" y="28" text-anchor="middle">内容线</text></g>
<g class="t"><rect x="345" y="8" width="315" height="30" rx="6"/><text class="th" x="502" y="28" text-anchor="middle">编码线</text></g>

<g class="p"><rect x="20" y="46" width="315" height="76" rx="6"/>
<text class="ts" x="36" y="66">一　你定方向</text>
<text class="ts" x="36" y="88">讲什么、什么观点、取舍哪些点。</text>
<text class="ts" x="36" y="108">判断节点在这，只能提议等你点头</text>
</g>
<g class="t"><rect x="345" y="46" width="315" height="76" rx="6"/>
<text class="ts" x="361" y="66">一　需求与设计</text>
<text class="ts" x="361" y="88">product-strategy 商业判断</text>
<text class="ts" x="361" y="108">product-breakdown 拆到能开发加AC</text>
</g>

<g class="p"><rect x="20" y="130" width="315" height="128" rx="6"/>
<text class="ts" x="36" y="150">二　进对应 skill，全流程在里面</text>
<text class="tm" x="36" y="174">live-lesson-deck</text><text class="ts" x="329" y="174" text-anchor="end">278行</text>
<text class="tm" x="36" y="196">live-qa-archive</text><text class="ts" x="329" y="196" text-anchor="end">110行</text>
<text class="tm" x="36" y="218">juzhang-lesson-script</text><text class="ts" x="329" y="218" text-anchor="end">354行</text>
<text class="tm" x="36" y="240">business-analyst</text><text class="ts" x="329" y="240" text-anchor="end">180行</text>
</g>
<g class="t"><rect x="345" y="130" width="315" height="128" rx="6"/>
<text class="ts" x="361" y="150">二　写之前先立规格</text>
<text class="tm" x="361" y="174">grill-with-docs</text><text class="ts" x="654" y="174" text-anchor="end">连环追问落ADR</text>
<text class="tm" x="361" y="196">wayfinder</text><text class="ts" x="654" y="196" text-anchor="end">大工程拆工单</text>
<text class="tm" x="361" y="218">research</text><text class="ts" x="654" y="218" text-anchor="end">查文档查API事实</text>
<text class="tm" x="361" y="240">tdd</text><text class="ts" x="654" y="240" text-anchor="end">先写失败测试</text>
</g>

<g class="p"><rect x="20" y="266" width="315" height="76" rx="6"/>
<text class="ts" x="36" y="286">三　产出</text>
<text class="ts" x="36" y="308">lesson.html／飞书文档加PPT／</text>
<text class="ts" x="36" y="328">逐字稿／HTML 分析报告</text>
</g>
<g class="t"><rect x="345" y="266" width="315" height="76" rx="6"/>
<text class="ts" x="361" y="286">三　动手</text>
<text class="ts" x="361" y="308">够重或能并行才派 code-writer，</text>
<text class="ts" x="361" y="328">否则主线直改。派工带已探明的现场</text>
</g>

<g class="p"><rect x="20" y="350" width="315" height="76" rx="6"/>
<text class="ts" x="36" y="370">四　交付前自检</text>
<text class="ts" x="36" y="392">四个 skill 各有自己的一节，</text>
<text class="ts" x="36" y="412">逐条过，卡住就说卡在哪条</text>
</g>
<g class="t"><rect x="345" y="350" width="315" height="76" rx="6"/>
<text class="ts" x="361" y="370">四　审查</text>
<text class="ts" x="361" y="392">code-reviewer 工程视角，</text>
<text class="ts" x="361" y="412">ux-reviewer 用户视角。往返上限两轮</text>
</g>

<line class="ln" x1="177" y1="426" x2="177" y2="448" marker-end="url(#arrow)"/>
<line class="ln" x1="502" y1="426" x2="502" y2="448" marker-end="url(#arrow)"/>

<g class="c"><rect x="20" y="450" width="640" height="90" rx="6"/>
<text class="th" x="36" y="472">两条线共用的最后一段</text><text class="ts" x="644" y="472" text-anchor="end">只要产出物被眼睛看就要过</text>
<text class="tm" x="36" y="496">frontend_antislop.md</text><text class="ts" x="644" y="496" text-anchor="end">反套路禁令加可数的版式规则</text>
<text class="tm" x="36" y="518">cn_typography.md</text><text class="ts" x="644" y="518" text-anchor="end">中文字体、加载纪律、断行</text>
<text class="ts" x="36" y="536">lesson.html 和 HTML 报告都算。原本有第三份工程底线，删了</text>
</g>

<g class="g"><rect x="20" y="552" width="640" height="66" rx="6"/>
<text class="th" x="36" y="574">全程都在的</text>
<text class="ts" x="36" y="596">no_ai_style 管每句中文　六个判断节点碰到就停　四条红线不碰</text>
<text class="ts" x="36" y="614">改规则前先查别处有没有权威版本　密钥只给位置不给明文</text>
</g>

<g class="p"><rect x="20" y="634" width="12" height="12" rx="2"/></g><text class="lg" x="38" y="644">内容线</text>
<g class="t"><rect x="106" y="634" width="12" height="12" rx="2"/></g><text class="lg" x="124" y="644">编码线</text>
<g class="c"><rect x="192" y="634" width="12" height="12" rx="2"/></g><text class="lg" x="210" y="644">共用段</text>
<g class="g"><rect x="278" y="634" width="12" height="12" rx="2"/></g><text class="lg" x="296" y="644">全程约束</text>
</svg>
