<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="680"/>

<g class="g"><rect x="190" y="8" width="300" height="38" rx="6"/><text class="th" x="340" y="26" text-anchor="middle">CLAUDE.md</text><text class="ts" x="340" y="41" text-anchor="middle">101行，开场自动注入，指向下面五份</text></g>
<line class="ln" x1="340" y1="46" x2="340" y2="58" marker-end="url(#arrow)"/>

<g class="c"><rect x="20" y="60" width="640" height="122" rx="6"/>
<text class="th" x="36" y="80">rules/ 五份</text><text class="ts" x="644" y="80" text-anchor="end">也是自动注入，跟 CLAUDE.md 一起进上下文</text>
<text class="tm" x="36" y="103">no_ai_style.md</text><text class="ts" x="644" y="103" text-anchor="end">22 个 skill 加 3 个 agent 引用，全库中心</text>
<text class="tm" x="36" y="124">cn_typography.md</text><text class="ts" x="644" y="124" text-anchor="end">4 个 skill 加 3 个 agent，中文界面唯一来源</text>
<text class="tm" x="36" y="145">error_log.md</text><text class="ts" x="644" y="145" text-anchor="end">6 条历史事故，被 live-qa-archive 引</text>
<text class="tm" x="36" y="166">sub_agent_dispatch.md　code_rules.md</text><text class="ts" x="644" y="166" text-anchor="end">派工硬约束、编码准则</text>
</g>
<line class="ln" x1="340" y1="182" x2="340" y2="196" marker-end="url(#arrow)"/>

<g class="t"><rect x="20" y="198" width="640" height="30" rx="6"/><text class="th" x="36" y="218">agents/ 四个</text><text class="ts" x="644" y="218" text-anchor="end">不自动注入，派工时才加载</text></g>

