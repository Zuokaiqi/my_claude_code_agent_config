<line class="ln" x1="340" y1="312" x2="340" y2="326" marker-end="url(#arrow)"/>

<g class="p"><rect x="20" y="328" width="640" height="30" rx="6"/><text class="th" x="36" y="348">skills/ 三十七个</text><text class="ts" x="644" y="348" text-anchor="end">只有描述常驻，正文用到才读</text></g>

<g class="p"><rect x="20" y="366" width="315" height="96" rx="6"/>
<text class="ts" x="36" y="386">内容生产 4</text><text class="tn" x="329" y="386" text-anchor="end">deck / 答疑 / 文稿 / 分析</text>
<text class="ts" x="36" y="406">前端 6</text><text class="tn" x="329" y="406" text-anchor="end">impeccable / slides / pdf / 三审查</text>
<text class="ts" x="36" y="426">产品拆解 4</text><text class="tn" x="329" y="426" text-anchor="end">strategy / breakdown / ooux / feature</text>
<text class="ts" x="36" y="448">工程流 5</text><text class="tn" x="329" y="448" text-anchor="end">tdd / grill / wayfinder / research 等</text>
</g>
<g class="p"><rect x="345" y="366" width="315" height="96" rx="6"/>
<text class="ts" x="361" y="386">文档工具 6</text><text class="tn" x="654" y="386" text-anchor="end">docx / xlsx / pptx / pdf / 飞书两个</text>
<text class="ts" x="361" y="406">写作 4</text><text class="tn" x="654" y="406" text-anchor="end">卡兹克 / 林亦 / 长文 / 横纵分析</text>
<text class="ts" x="361" y="426">其他 8</text><text class="tn" x="654" y="426" text-anchor="end">aihot / neat-freak / 存储 / 定位 等</text>
<text class="ts" x="361" y="448">22 个引用 no_ai_style，其余是英文工具</text>
</g>

<g class="g"><rect x="20" y="476" width="640" height="104" rx="6"/>
<text class="th" x="36" y="496">skill 之间只有四条引用</text><text class="ts" x="644" y="496" text-anchor="end">37 个里绝大多数互不依赖</text>
<text class="tm" x="36" y="519">business-analyst → pdf-publisher</text><text class="ts" x="644" y="519" text-anchor="end">今天刚建，PDF 技术链路</text>
<text class="tm" x="36" y="540">live-lesson-deck → ui-copy-check</text><text class="ts" x="644" y="540" text-anchor="end">课件上墙字检查</text>
<text class="tm" x="36" y="561">ux-bug-check → ui-copy-check 加 webapp-testing</text><text class="ts" x="644" y="561" text-anchor="end">体验审查的两个下游</text>
<text class="tm" x="36" y="576">product-breakdown → feature-breakdown 加 ooux</text><text class="ts" x="644" y="576" text-anchor="end">拆解的两条方法论</text>
</g>

