<text class="tn" x="260" y="292" text-anchor="middle">webapp-testing</text>
<text class="tn" x="260" y="306" text-anchor="middle">cn_typography</text>
</g>
<g class="t"><rect x="348" y="236" width="152" height="76" rx="6"/>
<text class="ts" x="424" y="256" text-anchor="middle">ux-reviewer</text>
<text class="tn" x="424" y="276" text-anchor="middle">ux-bug-check</text>
<text class="tn" x="424" y="292" text-anchor="middle">webapp-testing</text>
