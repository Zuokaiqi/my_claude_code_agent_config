<line class="ln" x1="340" y1="308" x2="340" y2="322" marker-end="url(#arrow)"/>

<g class="t"><rect x="20" y="324" width="640" height="40" rx="6"/><text class="th" x="36" y="343">条件触发　用到才读</text><text class="ts" x="644" y="343" text-anchor="end">这次把三份挪到了这一层</text></g>

<g class="t"><rect x="20" y="372" width="640" height="94" rx="6"/>
<text class="ts" x="36" y="394">feishu-doc　　新建的 skill，飞书一周只用一次，不再常驻</text>
