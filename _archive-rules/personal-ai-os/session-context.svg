<g class="c"><rect x="20" y="64" width="640" height="40" rx="6"/><text class="th" x="36" y="83">无条件注入　约 36.5k token</text><text class="ts" x="644" y="83" text-anchor="end">改之前 55k，省下 18.5k</text></g>

<g class="c"><rect x="20" y="112" width="310" height="196" rx="6"/>
