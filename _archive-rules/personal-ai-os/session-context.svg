<text class="ts" x="36" y="460">原有的：SYSTEM.md 路由、各 skill 正文、impeccable、design-md</text>
</g>

<g class="g"><rect x="20" y="482" width="640" height="108" rx="6"/>
<text class="th" x="36" y="503">这次动了什么</text>
<text class="ts" x="36" y="525">一　sub_agent_dispatch 从 331 行砍到 80 行，只留四条事故换来的硬约束</text>
