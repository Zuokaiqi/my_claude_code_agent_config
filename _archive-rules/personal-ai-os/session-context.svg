<text class="ts" x="36" y="565">三　design_template 并进 ui-designer 附录</text>
<text class="ts" x="36" y="583">四　no_ai_style 23 条合并到 9 组，词表一条没删，只删溯源日期</text>
</g>

<g class="c"><rect x="20" y="608" width="12" height="12" rx="2"/></g><text class="lg" x="38" y="618">无条件注入</text>
