<svg xmlns="http://www.w3.org/2000/svg" width="680" height="592" viewBox="0 0 680 592" role="img">
<title>个人AI操作系统现状结构图</title>
<desc>入口是全局CLAUDE.md的preflight，往下分内容生产轨和编码轨两条，两条都会走到设计轨，横向有一层rules硬约束，底部是制度维护层。</desc>
<style>
.bg{fill:#FFFFFF}
.th{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:500}
.ts{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px;font-weight:400}
.ln{stroke:#B4B2A9;stroke-width:1.5;fill:none}
.p rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.p .th{fill:#3C3489}
.p .ts{fill:#534AB7}
.t rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.t .th{fill:#085041}
.t .ts{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c .th{fill:#712B13}
.c .ts{fill:#993C1D}
.g rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.g .th{fill:#444441}
.g .ts{fill:#5F5E5A}
.lg{fill:#5F5E5A;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px}
@media (prefers-color-scheme:dark){
.bg{fill:#1B1B1A}
.ln{stroke:#888780}
.p rect{fill:#3C3489;stroke:#AFA9EC}
.p .th{fill:#CECBF6}
.p .ts{fill:#AFA9EC}
.t rect{fill:#085041;stroke:#5DCAA5}
.t .th{fill:#9FE1CB}
.t .ts{fill:#5DCAA5}
.c rect{fill:#712B13;stroke:#F0997B}
.c .th{fill:#F5C4B3}
.c .ts{fill:#F0997B}
.g rect{fill:#444441;stroke:#B4B2A9}
.g .th{fill:#D3D1C7}
.g .ts{fill:#B4B2A9}
.lg{fill:#B4B2A9}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="592"/>

<g class="g"><rect x="230" y="8" width="220" height="44" rx="6"/><text class="th" x="340" y="28" text-anchor="middle">全局 CLAUDE.md</text><text class="ts" x="340" y="44" text-anchor="middle">preflight：查项目规范再分轨</text></g>

<line class="ln" x1="340" y1="52" x2="340" y2="64"/><line class="ln" x1="170" y1="64" x2="510" y2="64"/><line class="ln" x1="170" y1="64" x2="170" y2="76" marker-end="url(#arrow)"/><line class="ln" x1="510" y1="64" x2="510" y2="76" marker-end="url(#arrow)"/>

<g class="p"><rect x="20" y="80" width="300" height="40" rx="6"/><text class="th" x="170" y="100" text-anchor="middle">内容生产轨</text><text class="ts" x="170" y="115" text-anchor="middle">personal-ai-os/SYSTEM.md</text></g>
<g class="t"><rect x="360" y="80" width="300" height="40" rx="6"/><text class="th" x="510" y="100" text-anchor="middle">编码轨</text><text class="ts" x="510" y="115" text-anchor="middle">rules/sub_agent_dispatch.md</text></g>

<g class="p"><rect x="20" y="132" width="300" height="30" rx="6"/><text class="ts" x="170" y="151" text-anchor="middle">dispatch.md 单一权威原则 + 各轨停点</text></g>
<g class="t"><rect x="360" y="132" width="300" height="30" rx="6"/><text class="ts" x="510" y="151" text-anchor="middle">体量阈值：500行 / 10文件</text></g>

<g class="p"><rect x="20" y="172" width="145" height="40" rx="6"/><text class="th" x="92" y="192" text-anchor="middle">备课课件</text><text class="ts" x="92" y="207" text-anchor="middle">live-lesson-deck</text></g>
<g class="p"><rect x="175" y="172" width="145" height="40" rx="6"/><text class="th" x="247" y="192" text-anchor="middle">答疑归档</text><text class="ts" x="247" y="207" text-anchor="middle">live-qa-archive</text></g>
<g class="p"><rect x="20" y="220" width="145" height="40" rx="6"/><text class="th" x="92" y="240" text-anchor="middle">B站文稿</text><text class="ts" x="92" y="255" text-anchor="middle">juzhang-script</text></g>
<g class="p"><rect x="175" y="220" width="145" height="40" rx="6"/><text class="th" x="247" y="240" text-anchor="middle">数据分析</text><text class="ts" x="247" y="255" text-anchor="middle">business-analyst</text></g>
<g class="p"><rect x="20" y="268" width="300" height="40" rx="6"/><text class="th" x="170" y="288" text-anchor="middle">知识库巡库</text><text class="ts" x="170" y="303" text-anchor="middle">obsidian-vault 三层结构</text></g>

<g class="t"><rect x="360" y="172" width="145" height="40" rx="6"/><text class="th" x="432" y="192" text-anchor="middle">ui-designer</text><text class="ts" x="432" y="207" text-anchor="middle">只出方案</text></g>
<g class="t"><rect x="515" y="172" width="145" height="40" rx="6"/><text class="th" x="587" y="192" text-anchor="middle">code-writer</text><text class="ts" x="587" y="207" text-anchor="middle">只写实现</text></g>
<g class="t"><rect x="360" y="220" width="145" height="40" rx="6"/><text class="th" x="432" y="240" text-anchor="middle">code-reviewer</text><text class="ts" x="432" y="255" text-anchor="middle">工程视角</text></g>
<g class="t"><rect x="515" y="220" width="145" height="40" rx="6"/><text class="th" x="587" y="240" text-anchor="middle">ux-reviewer</text><text class="ts" x="587" y="255" text-anchor="middle">用户视角</text></g>
<g class="t"><rect x="360" y="268" width="300" height="40" rx="6"/><text class="th" x="510" y="288" text-anchor="middle">mattpocock 工程流</text><text class="ts" x="510" y="303" text-anchor="middle">grill / wayfinder / tdd / research</text></g>

<line class="ln" x1="170" y1="308" x2="170" y2="326" marker-end="url(#arrow)"/><line class="ln" x1="510" y1="308" x2="510" y2="326" marker-end="url(#arrow)"/>

<g class="c"><rect x="20" y="328" width="640" height="46" rx="6"/><text class="th" x="340" y="349" text-anchor="middle">设计轨：两条轨都会走到这里</text><text class="ts" x="340" y="365" text-anchor="middle">产品UI用 impeccable · 营销页从 design-md 挑参照 · 中文配 cn_typography</text></g>

<g class="c"><rect x="20" y="386" width="640" height="46" rx="6"/><text class="th" x="340" y="407" text-anchor="middle">横向硬约束 rules/（全轨适用，动手前必读）</text><text class="ts" x="340" y="423" text-anchor="middle">no_ai_style · error_log · code_rules · frontend_antislop · ui_engineering_baseline</text></g>

<g class="g"><rect x="20" y="444" width="640" height="46" rx="6"/><text class="th" x="340" y="465" text-anchor="middle">制度维护层（改规则本身要走这里）</text><text class="ts" x="340" y="481" text-anchor="middle">checklist 判断节点 · maintenance 修改权（templates 与 VERIFY 已归档）</text></g>

<g class="p"><rect x="20" y="516" width="12" height="12" rx="2"/></g><text class="lg" x="38" y="526">内容生产轨</text>
<g class="t"><rect x="118" y="516" width="12" height="12" rx="2"/></g><text class="lg" x="136" y="526">编码轨</text>
<g class="c"><rect x="192" y="516" width="12" height="12" rx="2"/></g><text class="lg" x="210" y="526">横向硬约束</text>
<g class="g"><rect x="290" y="516" width="12" height="12" rx="2"/></g><text class="lg" x="308" y="526">入口与制度维护</text>
</svg>
